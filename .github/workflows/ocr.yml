name: OCR (optional)

on:
  pull_request:
    paths:
      - 'tools/ocr/**'
      - '.github/workflows/ocr.yml'
  push:
    branches:
      - 'feature/optional-ocr-preprocessing'
    paths:
      - 'tools/ocr/**'
      - '.github/workflows/ocr.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract and English/German languages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - name: Install optional image dependencies
        run: python -m pip install 'opencv-python-headless>=4.10,<5'
      - name: Compile check
        run: python -m py_compile tools/ocr/prepare_text_layer.py
      - name: OCR unit and real-image tests
        run: python -m unittest discover -s tools/ocr/tests -v